<aside class="app-sidebar">

  <!-- ── Logo ──────────────────────────────────── -->
  <div class="sidebar__logo" routerLink="/" style="cursor:pointer">
    <div class="sidebar__logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>
    <div class="sidebar__logo-text">
      <span class="sidebar__app-name">Academic</span>
      <span class="sidebar__app-sub">Analyzer</span>
    </div>
  </div>

  <hr class="sidebar__divider">

  <!-- ── Primary Navigation ───────────────────── -->
  <nav class="sidebar__nav">
    <ul class="sidebar__nav-list">
      @for (item of navItems; track item.route) {
        <li>
          <a
            class="sidebar__nav-item"
            [routerLink]="item.route"
            routerLinkActive="sidebar__nav-item--active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
          >
            <span class="sidebar__nav-icon" [innerHTML]="item.icon"></span>
            <span class="sidebar__nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- ── Bottom Section ───────────────────────── -->
  <div class="sidebar__bottom">
    <hr class="sidebar__divider">
    <ul class="sidebar__nav-list">
      @for (item of bottomItems; track item.route) {
        <li>
          <a
            class="sidebar__nav-item"
            [routerLink]="item.route"
            routerLinkActive="sidebar__nav-item--active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
          >
            <span class="sidebar__nav-icon" [innerHTML]="item.icon"></span>
            <span class="sidebar__nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <!-- User Avatar (placeholder) -->
    <div class="sidebar__user">
      <div class="sidebar__user-avatar">S</div>
      <div class="sidebar__user-info">
        <span class="sidebar__user-name">Student</span>
        <span class="sidebar__user-meta">Semester 5 · VTU</span>
      </div>
    </div>
  </div>

</aside>
